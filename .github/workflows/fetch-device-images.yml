name: Fetch device WebP images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-device-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/device_images/requirements.txt

      - name: Fetch and convert images
        run: python scripts/device_images/fetch_device_images.py

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/devices/DEV-*.webp scripts/device_images/image_sources.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add device product images"
            git push
          fi
